<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julians projects</title>
<style>
  :root{
    --bg: #f2f2f7;
    --panel: #ffffff;
    --panel-border: rgba(0,0,0,0.06);
    --text: #1c1c1e;
    --text-secondary: #6e6e73;
    --divider: rgba(60,60,67,0.14);
    --row-hover: rgba(0,0,0,0.035);
    --row-active: rgba(0,0,0,0.06);
    --submenu-bg: rgba(0,0,0,0.02);
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
    --focus-ring: #0071e3;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg: #000000;
      --panel: #1c1c1e;
      --panel-border: rgba(255,255,255,0.08);
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --divider: rgba(84,84,88,0.55);
      --row-hover: rgba(255,255,255,0.06);
      --row-active: rgba(255,255,255,0.1);
      --submenu-bg: rgba(255,255,255,0.035);
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
      --focus-ring: #409cff;
    }
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  main{
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 20px 100px;
    animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    main{ animation: none; }
    .submenu, .chevron, .row-title svg{ transition: none !important; }
  }

  header{
    margin-bottom: 40px;
  }

  .eyebrow{
    font-size: 15px;
    font-weight: 590;
    color: var(--text-secondary);
    margin: 0 0 4px;
  }

  h1{
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }

  .lede{
    font-size: 17px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 0;
    max-width: 52ch;
  }

  .section{
    margin-bottom: 34px;
  }

  .section-title{
    font-size: 13px;
    font-weight: 590;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    margin: 0 0 8px;
    padding: 0 16px;
  }

  .panel{
    background: var(--panel);
    border-radius: 14px;
    border: 1px solid var(--panel-border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* Shared row look for plain links (About panel) */
  a.row{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    min-height: 52px;
    text-decoration: none;
    color: inherit;
    border-bottom: 1px solid var(--divider);
    transition: background-color 0.12s ease;
  }

  .panel > a.row:last-child{
    border-bottom: none;
  }

  a.row:hover{
    background: var(--row-hover);
  }

  a.row:active{
    background: var(--row-active);
  }

  a.row:focus-visible{
    outline: 2px solid var(--focus-ring);
    outline-offset: -2px;
    background: var(--row-hover);
  }

  .icon{
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg{
    width: 17px;
    height: 17px;
    stroke: #fff;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .row-text{
    flex: 1;
    min-width: 0;
  }

  .row-title{
    font-size: 16px;
    font-weight: 400;
    line-height: 1.3;
  }

  .row-subtitle{
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.3;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chevron{
    flex: 0 0 auto;
    color: var(--text-secondary);
    opacity: 0.55;
  }

  .chevron svg{
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Expandable project rows */
  .project{
    border-bottom: 1px solid var(--divider);
  }

  .panel > .project:last-child{
    border-bottom: none;
  }

  .project-trigger{
    all: unset;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    min-height: 52px;
    width: 100%;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }

  .project-trigger:hover{
    background: var(--row-hover);
  }

  .project-trigger:active{
    background: var(--row-active);
  }

  .project-trigger:focus-visible{
    outline: 2px solid var(--focus-ring);
    outline-offset: -2px;
    background: var(--row-hover);
  }

  .project-trigger .chevron svg{
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    transform: rotate(90deg);
  }

  .project-trigger[aria-expanded="true"] .chevron svg{
    transform: rotate(-90deg);
  }

  .submenu{
    display: grid;
    grid-template-rows: 0fr;
    background: var(--submenu-bg);
    transition: grid-template-rows 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .project.open .submenu{
    grid-template-rows: 1fr;
  }

  .submenu-inner{
    overflow: hidden;
  }

  .submenu a.row{
    padding-left: 16px;
    min-height: 46px;
    border-bottom: 1px solid var(--divider);
  }

  .submenu a.row:last-child{
    border-bottom: none;
  }

  .submenu .icon{
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    background: transparent !important;
  }

  .submenu .icon svg{
    width: 15px;
    height: 15px;
    stroke: var(--text-secondary);
  }

  .submenu .row-title{
    font-size: 15px;
    color: var(--text-secondary);
  }

  footer{
    margin-top: 48px;
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
  }

  footer a{
    color: inherit;
  }
</style>
</head>
<body>

              <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/>
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/></svg>

<script>
  document.querySelectorAll('.project-trigger').forEach(function(trigger){
    trigger.addEventListener('click', function(){
      var project = trigger.closest('.project');
      var isOpen = project.classList.contains('open');

      document.querySelectorAll('.project.open').forEach(function(openProject){
        if(openProject !== project){
          openProject.classList.remove('open');
          openProject.querySelector('.project-trigger').setAttribute('aria-expanded', 'false');
        }
      });

      project.classList.toggle('open', !isOpen);
      trigger.setAttribute('aria-expanded', String(!isOpen));
    });
  });
</script>

</body>
