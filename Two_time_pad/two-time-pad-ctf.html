<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Two-Time Pad</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>

  :root{
   --bg:#03132e;    
   --panel:#081c3f;    
   --panel-2:#0d2550;    
   --border:#1c3a6b;    
   --text:#e7edf7;    
   --text-dim:#8fa3c4;   
   --gold:#4fa6e0;  
   --green:#5fae7e;    
   --red:#d6545f;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: 'IBM Plex Mono', monospace;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:60px 22px 120px;
  }

  h1{
    font-size:2rem;
    font-weight:700;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }

  .sub{
    color:var(--text-dim);
    font-size:1.05rem;
    margin:0 0 40px;
    max-width:70ch;
  }

  .sub b{ color:var(--text); font-weight:600; }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
    margin-bottom:26px;
  }

  label.field{ display:block; }

  .field span{
    display:block;
    font-size:0.82rem;
    color:var(--text);
    margin-bottom:6px;
  }

  input[type=text]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.92rem;
    padding:10px 12px;
    border-radius:4px;
    outline:none;
  }

  input[type=text]:focus-visible{ border-color:var(--gold); }

  .hint{
    margin-top:12px;
    font-size:0.82rem;
    color:var(--text-dim);
  }

  .visual-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:20px;
    color:var(--text);
    font-size:0.95rem;
  }

  .visual-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--red);
    letter-spacing:0.04em;
  }

  .visual-stage{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:14px;
  }

  .pixel-panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }

  .pixel-label{
    background:var(--panel);
    color:var(--text);
    padding:8px 10px;
    font-size:0.78rem;
    font-family:'IBM Plex Mono',monospace;
  }

  .pixel-label span{ color:var(--text-dim); margin-left:5px; }

  .pixel-panel canvas{
    display:block;
    width:100%;
    height:100px;
    background:#fff;
    image-rendering:pixelated;
  }

  .pixel-operator{
    text-align:center;
    color:var(--text-dim);
    font-size:0.84rem;
    padding:14px 0;
  }

  .pixel-operator b{ color:var(--text); font-weight:600; }

  .xor-result-panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }

  .xor-result-panel canvas{
    display:block;
    width:100%;
    height:130px;
    background:#fff;
    image-rendering:pixelated;
  }

  button.primary{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:clamp(0.8rem, 2vw, 0.95rem);
    line-height:1.2;
    background:var(--gold);
    color:#1a1508;
    border:none;
    border-radius:4px;
    padding:11px 16px;
    cursor:pointer;
    margin:0;
    width:22%;
    max-width:22%;
    min-width:0;
    height:auto;
    min-height:44px;
    box-sizing:border-box;
    white-space:normal;
    overflow-wrap:anywhere;
    text-align:center;
  }


  button.primary:hover{ filter:brightness(1.08); }

  button.primary:focus-visible{
    outline:2px solid var(--text);
    outline-offset:2px;
  }

  @media (max-width:700px){
    .visual-stage{ grid-template-columns:1fr; }
  }

  @media (max-width:520px){
    .visual-title{
      align-items:flex-start;
      flex-direction:column;
      gap:5px;
    }
    .pixel-panel canvas{ height:80px; }
    .xor-result-panel canvas{ height:110px; }

    button.primary{
      height:auto;
      min-height:44px;
    }
  }

</style>
</head>


<body>

<div class="wrap">

  <h1>Two-Time Pad</h1>


  <div class="panel">

  <label class="field">
    <span>Din melding</span>
    <div style="display: flex; gap: 10px;">
      <input
        type="text"
        id="msg1"
        maxlength="40"
        placeholder="skriv noe her..."
        value=""
      >
      <button type="button" class="primary" id="xorBtn">Krypter melding</button>
    </div>
  </label>


  </div>





  <div class="visual-stage">

    <div class="pixel-panel">
      <div class="pixel-label">
        Din melding kryptert
      </div>
      <canvas id="cipherA"></canvas>
    </div>

    <div class="pixel-panel">
      <div class="pixel-label">
        Hemmelighet kryptert
      </div>
      <canvas id="cipherB"></canvas>
    </div>

  </div>




  <div class="xor-result-panel">
    <div class="pixel-label">
      Din melding kryptert ⊕ Hemmelighet kryptert
    </div>
    <canvas id="xorCanvas"></canvas>
  </div>



    </label>

    <div class="verdict" id="verdict"></div>

  </div>

</div>

  const logoImg = new Image();
  let logoLoaded = false;
  let LOGO_PIXELS = null; // cached Uint8Array of 1s/0s, same format as textToPixels()
  logoImg.onload = () => {
    logoLoaded = true;
    LOGO_PIXELS = imageToPixels(logoImg, WIDTH, HEIGHT);
    drawLogoOnAll();
  };
  logoImg.src = LOGO_SRC;

  function imageToPixels(img, width, height){
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);

    const scale = Math.min(width / img.width, height / img.height) * 0.7;
    const drawW = img.width * scale;
    const drawH = img.height * scale;
    const dx = (width - drawW) / 2;
    const dy = (height - drawH) / 2;

    ctx.drawImage(img, dx, dy, drawW, drawH);

    const image = ctx.getImageData(0, 0, width, height);
    const pixels = new Uint8Array(width * height);

    for(let i = 0; i < pixels.length; i++){
      const r = image.data[i * 4];
      const g = image.data[i * 4 + 1];
      const b = image.data[i * 4 + 2];
      const brightness = (r + g + b) / 3;
      pixels[i] = brightness < 128 ? 1 : 0;
    }

    return pixels;
  }

  function drawLogoOnAll() {
    if (!logoLoaded) return;
    [cipherA, cipherB, xorCanvas].forEach(c => {
      c.width = WIDTH;
      c.height = HEIGHT;
    });
    renderBinaryPixels(cipherA, LOGO_PIXELS,WIDTH,HEIGHT);
    renderBinaryPixels(cipherB, LOGO_PIXELS,WIDTH,HEIGHT);
    renderBinaryPixels(xorCanvas, LOGO_PIXELS,WIDTH,HEIGHT);
  }

  function textToPixels(text, width, height){

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#000000';
    ctx.font = 'bold 28px "IBM Plex Mono", monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 12, height / 2);

    const image = ctx.getImageData(0, 0, width, height);
    const pixels = new Uint8Array(width * height);

    for(let i = 0; i < pixels.length; i++){
      const r = image.data[i * 4];
      const g = image.data[i * 4 + 1];
      const b = image.data[i * 4 + 2];
      const brightness = (r + g + b) / 3;
      pixels[i] = brightness < 128 ? 1 : 0;
    }

    return pixels;
  }

  window.REUSE_KEY = false;
  
  function randomPixelKey(length){
    const key = new Uint8Array(length);
    const CHUNK = 65536; 
    const randomBytes = new Uint8Array(length);

    for(let offset = 0; offset < length; offset += CHUNK){
      const slice = randomBytes.subarray(offset, Math.min(offset + CHUNK, length));
      window.crypto.getRandomValues(slice);
    }

    for(let i = 0; i < length; i++){
      key[i] = randomBytes[i] & 1;
    }

    return key;
  }

  function xorPixels(a, b){
    const result = new Uint8Array(a.length);
    for(let i = 0; i < a.length; i++){
      result[i] = a[i] ^ b[i];
    }
    return result;
  }

  function renderBinaryPixels(canvas, pixels, width, height){
    const ctx = canvas.getContext('2d');
    canvas.width = width;
    canvas.height = height;

    const FG = [0, 38, 227];       
    const BG = [255, 255, 255]; 

    const image = ctx.createImageData(width, height);

    for(let i = 0; i < pixels.length; i++){
      const [r, g, b] = pixels[i] ? FG : BG;
      image.data[i * 4]     = r;
      image.data[i * 4 + 1] = g;
      image.data[i * 4 + 2] = b;
      image.data[i * 4 + 3] = 255;
    }

    ctx.putImageData(image, 0, 0);
  }

let pixelColors = null; // cache, opprettes én gang

function renderColorPixels(canvas, pixels) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const image = ctx.createImageData(canvas.width, canvas.height);

 
  if (!pixelColors || pixelColors.length !== pixels.length) {
    pixelColors = new Array(pixels.length);
  }

  for (let i = 0; i < pixels.length; i++) {
    const offset = i * 4;

    if (pixels[i] === 1) {
      
      if (!pixelColors[i]) {
        pixelColors[i] = [
          Math.floor(Math.random() * 256),
          Math.floor(Math.random() * 256),
          Math.floor(Math.random() * 256),
        ];
      }
      const [r, g, b] = pixelColors[i];

      image.data[offset] = r;
      image.data[offset + 1] = g;
      image.data[offset + 2] = b;
      image.data[offset + 3] = 255;
